                      pm.setComponentEnabledSetting(new ComponentName(pkg, pkg + ALIAS[i]),
                          PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP);
                  p.edit().putString("cur", level).apply();
              }

