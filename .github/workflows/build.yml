          package ru.barometr.neba;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import java.util.Calendar;

          // fires at each chosen time: asks unless the user marked their mood very recently, then plans the next time
          public class MoodAlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent intent) {
                  SharedPreferences s = MoodNotify.prefs(c);
                  int every = s.getInt("every", 0);
                  long last = s.getLong("lastMark", 0), now = System.currentTimeMillis();
                  boolean recent;
                  if (every >= 1440) {
                      Calendar a = Calendar.getInstance(), b = Calendar.getInstance();
                      a.setTimeInMillis(last); b.setTimeInMillis(now);
                      recent = a.get(Calendar.YEAR) == b.get(Calendar.YEAR) && a.get(Calendar.DAY_OF_YEAR) == b.get(Calendar.DAY_OF_YEAR);
                  } else {
                      recent = now - last < every * 60000L / 2;
                  }
                  SharedPreferences.Editor ed = s.edit().putLong("lastFire", now);
                  if (every > 0 && !recent) { MoodNotify.post(c); ed.putLong("lastPosted", now); }
                  ed.apply();
                  MoodNotify.schedule(c);
                  if (MoodKeep.wanted(c)) MoodKeep.sync(c);
              }
          }
