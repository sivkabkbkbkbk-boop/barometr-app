          // a smiley pressed in the notification: keep it until the app picks it up, show "recorded"
          public class MoodMarkReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent intent) {
                  String k = intent.getStringExtra("k");
                  if (k == null) return;
                  long now = System.currentTimeMillis();
                  SharedPreferences s = MoodNotify.prefs(c);
                  try {
                      JSONArray a = new JSONArray(s.getString("pending", "[]"));
                      JSONObject o = new JSONObject();
                      o.put("k", k);
                      o.put("t", now);
                      a.put(o);
                      s.edit().putString("pending", a.toString()).putLong("lastMark", now).apply();
                  } catch (Exception e) { }
