                      try {
                          final int hPx = Math.round(WPX * (float) PH / PW);
                          final WebView wv = new WebView(getContext());
                          wv.getSettings().setJavaScriptEnabled(false);
                          wv.setBackgroundColor(0xFFFFFFFF);
                          // attached but out of sight: some WebViews draw nothing while detached
                          final ViewGroup root = (ViewGroup) getActivity().getWindow().getDecorView();
                          FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(WPX, hPx * pages);
                          wv.setLayoutParams(lp);
                          wv.setTranslationX(-10 * WPX);
                          root.addView(wv);
                          wv.measure(View.MeasureSpec.makeMeasureSpec(WPX, View.MeasureSpec.EXACTLY), View.MeasureSpec.makeMeasureSpec(hPx * pages, View.MeasureSpec.EXACTLY));
                          wv.layout(0, 0, WPX, hPx * pages);
                          wv.setWebViewClient(new WebViewClient() {
                              boolean done = false;
                              @Override public void onPageFinished(WebView v, String url) {
                                  if (done) return; done = true;
                                  new Handler(Looper.getMainLooper()).postDelayed(new Runnable() { public void run() {
                                      try {
                                          PdfDocument doc = new PdfDocument();
                                          float k = (float) PW / WPX;
                                          for (int i = 0; i < pages; i++) {
                                              PdfDocument.Page p = doc.startPage(new PdfDocument.PageInfo.Builder(PW, PH, i + 1).create());
                                              android.graphics.Canvas c = p.getCanvas();
                                              c.scale(k, k);
                                              c.translate(0, -i * hPx);
                                              wv.draw(c);
                                              doc.finishPage(p);
                                          }
                                          File dir = new File(getContext().getCacheDir(), "reports");
                                          dir.mkdirs();
                                          File f = new File(dir, name + ".pdf");
                                          FileOutputStream out = new FileOutputStream(f);
                                          doc.writeTo(out); out.close(); doc.close();
                                          root.removeView(wv); wv.destroy();
                                          deliver(call, f, mode);
                                      } catch (Throwable e) { root.removeView(wv); call.reject(e.toString()); }
                                  }}, 600);
                              }
                          });
                          wv.loadDataWithBaseURL("https://localhost/", html, "text/html", "utf-8", null);
                      } catch (Throwable e) { call.reject(e.toString()); }
                  }});
              }

              private void deliver(PluginCall call, File f, String mode) throws Exception {
                  JSObject r = new JSObject();
                  if ("save".equals(mode) && Build.VERSION.SDK_INT >= 29) {
                      ContentValues cv = new ContentValues();
                      cv.put(MediaStore.Downloads.DISPLAY_NAME, f.getName());
                      cv.put(MediaStore.Downloads.MIME_TYPE, "application/pdf");
                      cv.put(MediaStore.Downloads.RELATIVE_PATH, "Download/");
                      Uri uri = getContext().getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                      if (uri == null) throw new Exception("no place in Downloads");
                      OutputStream os = getContext().getContentResolver().openOutputStream(uri);
                      InputStream is = new FileInputStream(f);
                      byte[] buf = new byte[16384]; int n;
                      while ((n = is.read(buf)) > 0) os.write(buf, 0, n);
                      is.close(); os.close();
                      r.put("where", "Загрузки/" + f.getName());
                      call.resolve(r);
                      return;
                  }
                  // share (and "save" on Android 9 and older, where the share sheet offers saving)
                  Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", f);
                  Intent i = new Intent(Intent.ACTION_SEND);
                  i.setType("application/pdf");
                  i.putExtra(Intent.EXTRA_STREAM, uri);
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  Intent ch = Intent.createChooser(i, "Дневник самонаблюдения");
                  ch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  getContext().startActivity(ch);
                  r.put("shared", true);
                  call.resolve(r);
              }
          }
