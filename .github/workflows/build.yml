          cat > $J/FcNotify.java <<'JAVA'
          package ru.barometr.neba;

          import android.app.AlarmManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // items: [{t: ms, title, text}] for the next two evenings; one alarm for the nearest, then the next one
          public class FcNotify extends BroadcastReceiver {
              static final String PREFS = "fc_notify";
              static final String CH = "forecast";
              static final int FLAGS = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;

              static SharedPreferences prefs(Context c) { return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE); }

              static JSONObject next(Context c, long after) {
                  try {
                      JSONArray a = new JSONArray(prefs(c).getString("items", "[]"));
                      JSONObject best = null;
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject o = a.optJSONObject(i);
                          if (o == null || o.optLong("t") <= after) continue;
                          if (best == null || o.optLong("t") < best.optLong("t")) best = o;
                      }
                      return best;
                  } catch (Exception e) { return null; }
              }

              static void schedule(Context c) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  PendingIntent pi = PendingIntent.getBroadcast(c, 40, new Intent(c, FcNotify.class), FLAGS);
                  am.cancel(pi);
                  JSONObject o = next(c, System.currentTimeMillis());
                  if (o == null) return;
                  if (Build.VERSION.SDK_INT >= 23) am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, o.optLong("t"), pi);
                  else am.set(AlarmManager.RTC_WAKEUP, o.optLong("t"), pi);
              }

              @Override
              public void onReceive(Context c, Intent intent) {
                  // the alarm may come a few minutes late: show the item whose time has just passed
                  JSONObject o = next(c, System.currentTimeMillis() - 30 * 60 * 1000L);
                  if (o != null && o.optLong("t") <= System.currentTimeMillis() + 60 * 1000L) show(c, o.optString("title"), o.optString("text"));
                  schedule(c);
              }

              static void show(Context c, String title, String text) {
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CH, "Прогноз самочувствия на завтра", NotificationManager.IMPORTANCE_DEFAULT);
                      ch.setDescription("Предупреждение накануне тяжёлого дня");
                      nm.createNotificationChannel(ch);
                  }
                  Intent i = new Intent(c, MainActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  NotificationCompat.Builder b = new NotificationCompat.Builder(c, CH)
                      .setSmallIcon(R.drawable.ic_stat_barometr)
                      .setColor(0xFFFFB04A)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(text))
                      .setContentIntent(PendingIntent.getActivity(c, 41, i, FLAGS))
                      .setAutoCancel(true);
                  try { nm.notify(7400, b.build()); } catch (SecurityException e) { }
              }
          }
