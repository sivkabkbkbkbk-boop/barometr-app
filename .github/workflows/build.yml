name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Подготовка веб-части
        run: |
          mkdir -p www
          cp index.html www/
          cp icon-*.png www/ 2>/dev/null || true
          [ -f manifest.webmanifest ] && cp manifest.webmanifest www/ || true

      - name: Установка Capacitor
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 @capacitor/app@6 @capacitor/preferences@6 @capacitor/share@6
          npx cap init "Не18мнеуже" ru.barometr.neba --web-dir=www
          npx cap add android
          # the build number becomes the Android version: a new APK installs over the old one as an update
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          # always sign with the debug.keystore from this repository, so every new APK installs over the old one
          sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile rootProject.file("..\/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' android/app/build.gradle
          grep -A7 "signingConfigs" android/app/build.gradle
          npx cap sync android

      - name: Разрешения, цвета, иконка
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>|' $M
          sed -i '0,/<\/activity>/s|</activity>|    <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="barometr" />\n            </intent-filter>\n        </activity>|' $M
          # in-app update: download the APK inside the app and hand it to the Android installer
          J=android/app/src/main/java/ru/barometr/neba
          mkdir -p $J
          cat > $J/ApkUpdatePlugin.java <<'JAVA'
          package ru.barometr.neba;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          // Downloads a new APK of this app inside the app and hands it to the Android installer.
          // Android always asks the owner to confirm the update; this only removes the browser step.
          @CapacitorPlugin(name = "ApkUpdate")
          public class ApkUpdatePlugin extends Plugin {

              private File apkFile() {
                  File dir = new File(getContext().getCacheDir(), "updates");
                  dir.mkdirs();
                  return new File(dir, "update.apk");
              }

              @PluginMethod
              public void download(final PluginCall call) {
                  final String url = call.getString("url");
                  if (url == null || !url.startsWith("https://")) { call.reject("bad url"); return; }
                  new Thread(new Runnable() { public void run() {
                      HttpURLConnection c = null;
                      try {
                          File f = apkFile();
                          if (f.exists()) f.delete();
                          URL u = new URL(url);
                          int hops = 0;
                          while (true) {
                              c = (HttpURLConnection) u.openConnection();
                              c.setInstanceFollowRedirects(false);
                              c.setConnectTimeout(20000);
                              c.setReadTimeout(40000);
                              int code = c.getResponseCode();
                              if (code >= 300 && code < 400 && hops < 8) {
                                  String loc = c.getHeaderField("Location");
                                  c.disconnect();
                                  u = new URL(u, loc);
                                  hops++;
                                  continue;
                              }
                              if (code != 200) throw new IOException("HTTP " + code);
                              break;
                          }
                          long total = c.getContentLengthLong();
                          long done = 0;
                          int last = -1;
                          InputStream in = c.getInputStream();
                          OutputStream out = new FileOutputStream(f);
                          try {
                              byte[] buf = new byte[65536];
                              int n;
                              while ((n = in.read(buf)) > 0) {
                                  out.write(buf, 0, n);
                                  done += n;
                                  int pct = total > 0 ? (int) (done * 100 / total) : -1;
                                  if (pct != last) {
                                      last = pct;
                                      JSObject p = new JSObject();
                                      p.put("pct", pct);
                                      p.put("done", done);
                                      notifyListeners("progress", p);
                                  }
                              }
                          } finally {
                              out.close();
                              in.close();
                          }
                          if (done < 100000) throw new IOException("file too small");
                          JSObject r = new JSObject();
                          r.put("size", done);
                          call.resolve(r);
                      } catch (Exception e) {
                          call.reject(String.valueOf(e.getMessage()));
                      } finally {
                          if (c != null) c.disconnect();
                      }
                  }}).start();
              }

              @PluginMethod
              public void canInstall(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("ok", Build.VERSION.SDK_INT < 26 || getContext().getPackageManager().canRequestPackageInstalls());
                  call.resolve(r);
              }

              @PluginMethod
              public void openInstallSettings(PluginCall call) {
                  Intent i = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getContext().getPackageName()));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(i);
                  call.resolve();
              }

              @PluginMethod
              public void install(PluginCall call) {
                  try {
                      File f = apkFile();
                      if (!f.exists()) { call.reject("no file"); return; }
                      Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", f);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(uri, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          JAVA
          cat > $J/MainActivity.java <<'JAVA'
          package ru.barometr.neba;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ApkUpdatePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          mkdir -p android/app/src/main/res/xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<paths xmlns:android="http://schemas.android.com/apk/res/android">\n  <external-path name="my_images" path="." />\n  <cache-path name="my_cache_images" path="." />\n</paths>\n' > android/app/src/main/res/xml/file_paths.xml
          grep -q "fileprovider" $M || sed -i 's|</application>|    <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true">\n            <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />\n        </provider>\n    </application>|' $M
          ST=android/app/src/main/res/values/styles.xml
          sed -i 's|<item name="windowActionBar">false</item>|<item name="windowActionBar">false</item>\n        <item name="android:statusBarColor">#0d1726</item>\n        <item name="android:navigationBarColor">#0d1726</item>\n        <item name="android:windowBackground">@color/barometr_bg</item>|' $ST
          sed -i 's|@drawable/splash|@color/barometr_bg|g' $ST
          C=android/app/src/main/res/values/barometr_colors.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="barometr_bg">#0d1726</color></resources>\n' > $C
          RES=android/app/src/main/res
          mkdir -p $RES/drawable
          printf '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">\n  <path android:fillColor="#FFFFFFFF" android:pathData="M12,4C6.5,4 2,8.5 2,14h2.2c0,-4.3 3.5,-7.8 7.8,-7.8s7.8,3.5 7.8,7.8H22C22,8.5 17.5,4 12,4z"/>\n  <path android:fillColor="#FFFFFFFF" android:pathData="M16.6,8.1l-5.1,4.7c-0.8,0.3 -1.3,1.1 -1.1,2c0.2,1 1.2,1.6 2.2,1.4c0.9,-0.2 1.5,-1 1.4,-1.9z"/>\n</vector>\n' > $RES/drawable/ic_stat_barometr.xml
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*; do
            cp icon-192.png $d/ic_launcher.png
            cp icon-192.png $d/ic_launcher_round.png
            cp icon-192.png $d/ic_launcher_foreground.png
          done
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Сборка
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../barometr.apk
          # stop if the APK is not signed with our key: such a build could not update the installed app
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $AS verify --print-certs ../barometr.apk | tee /tmp/cert.txt
          grep -qi "7483879ca8e5bbb41b6e3ad7f9c08c38ae821f041876aab5cb920c53d94dbb71" /tmp/cert.txt || { echo "APK подписан не тем ключом"; exit 1; }

      - name: Файл для скачивания (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: barometr-apk
          path: barometr.apk

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Не18мнеуже, сборка ${{ github.run_number }}
          files: barometr.apk
          make_latest: true
