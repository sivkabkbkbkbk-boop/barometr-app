          XML
          sed -i 's|</application>|    <receiver android:name=".MoodAlarmReceiver" android:exported="false" />\n        <receiver android:name=".MoodMarkReceiver" android:exported="false" />\n        <receiver android:name=".MoodBootReceiver" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED" />\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n            </intent-filter>\n        </receiver>\n    </application>|' $M
          mkdir -p android/app/src/main/res/xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<paths xmlns:android="http://schemas.android.com/apk/res/android">\n  <external-path name="my_images" path="." />\n  <cache-path name="my_cache_images" path="." />\n</paths>\n' > android/app/src/main/res/xml/file_paths.xml
          grep -q "fileprovider" $M || sed -i 's|</application>|    <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true">\n            <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />\n        </provider>\n    </application>|' $M
          ST=android/app/src/main/res/values/styles.xml
          sed -i 's|<item name="windowActionBar">false</item>|<item name="windowActionBar">false</item>\n        <item name="android:statusBarColor">#0d1726</item>\n        <item name="android:navigationBarColor">#0d1726</item>\n        <item name="android:windowBackground">@color/barometr_bg</item>|' $ST
          sed -i 's|@drawable/splash|@color/barometr_bg|g' $ST
          C=android/app/src/main/res/values/barometr_colors.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="barometr_bg">#0d1726</color></resources>\n' > $C
          RES=android/app/src/main/res
          mkdir -p $RES/drawable
          printf '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">\n  <path android:fillColor="#FFFFFFFF" android:pathData="M12,4C6.5,4 2,8.5 2,14h2.2c0,-4.3 3.5,-7.8 7.8,-7.8s7.8,3.5 7.8,7.8H22C22,8.5 17.5,4 12,4z"/>\n  <path android:fillColor="#FFFFFFFF" android:pathData="M16.6,8.1l-5.1,4.7c-0.8,0.3 -1.3,1.1 -1.1,2c0.2,1 1.2,1.6 2.2,1.4c0.9,-0.2 1.5,-1 1.4,-1.9z"/>\n</vector>\n' > $RES/drawable/ic_stat_barometr.xml
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*; do
            cp icon-192.png $d/ic_launcher.png
            cp icon-192.png $d/ic_launcher_round.png
            cp icon-192.png $d/ic_launcher_foreground.png
          done
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Сборка
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../barometr.apk
          # stop if the APK is not signed with our key: such a build could not update the installed app
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $AS verify --print-certs ../barometr.apk | tee /tmp/cert.txt
          grep -qi "7483879ca8e5bbb41b6e3ad7f9c08c38ae821f041876aab5cb920c53d94dbb71" /tmp/cert.txt || { echo "APK подписан не тем ключом"; exit 1; }

      - name: Файл для скачивания (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: barometr-apk
          path: barometr.apk

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Не18мнеуже, сборка ${{ github.run_number }}
          files: barometr.apk
          make_latest: true
