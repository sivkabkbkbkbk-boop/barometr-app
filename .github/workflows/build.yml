          # steps from the phone's own step sensor (like VK does it)
          cat > $J/PhoneSteps.java <<'JAVA'
          package ru.barometr.neba;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.os.Handler;
          import android.os.HandlerThread;
          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.Iterator;
          import java.util.Locale;
          import org.json.JSONObject;

          // The sensor counts steps since the phone was switched on. Every hour, and when the app asks, we read it
          // and add the difference to the day it happened in; a smaller number than last time means a reboot.
          public class PhoneSteps extends BroadcastReceiver {
              static final String PREFS = "phone_steps";
              static final int FLAGS = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;

              static SharedPreferences prefs(Context c) { return c.getApplicationContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE); }

              static boolean hasSensor(Context c) {
                  SensorManager sm = (SensorManager) c.getSystemService(Context.SENSOR_SERVICE);
                  return sm != null && sm.getDefaultSensor(Sensor.TYPE_STEP_COUNTER) != null;
              }

              static void schedule(Context c) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  PendingIntent pi = PendingIntent.getBroadcast(c, 50, new Intent(c, PhoneSteps.class), FLAGS);
                  am.cancel(pi);
                  if (!prefs(c).getBoolean("on", false)) return;
                  am.setInexactRepeating(AlarmManager.RTC, System.currentTimeMillis() + AlarmManager.INTERVAL_HOUR, AlarmManager.INTERVAL_HOUR, pi);
              }

              static String day(long t) { return new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(new Date(t)); }

              // one reading of the sensor; done runs on a background thread with the days map, or null
              static void sample(final Context c, final Runnable done) {
                  final SensorManager sm = (SensorManager) c.getSystemService(Context.SENSOR_SERVICE);
                  final Sensor s = sm == null ? null : sm.getDefaultSensor(Sensor.TYPE_STEP_COUNTER);
                  if (s == null) { done.run(); return; }
                  final HandlerThread th = new HandlerThread("steps");
                  th.start();
                  final Handler h = new Handler(th.getLooper());
                  final boolean[] fin = {false};
                  final SensorEventListener l = new SensorEventListener() {
                      public void onSensorChanged(SensorEvent e) {
                          synchronized (fin) { if (fin[0]) return; fin[0] = true; }
                          sm.unregisterListener(this);
                          try { add(c, (long) e.values[0], System.currentTimeMillis()); } catch (Throwable x) { }
                          done.run(); th.quitSafely();
                      }
                      public void onAccuracyChanged(Sensor sensor, int a) { }
                  };
                  sm.registerListener(l, s, SensorManager.SENSOR_DELAY_NORMAL, 0, h);
                  // no event within 10 s (some phones answer only after a step): give up for now
                  h.postDelayed(new Runnable() { public void run() {
                      synchronized (fin) { if (fin[0]) return; fin[0] = true; }
                      sm.unregisterListener(l); done.run(); th.quitSafely();
                  }}, 10000);
              }

              static synchronized void add(Context c, long count, long now) throws Exception {
                  SharedPreferences p = prefs(c);
                  // build 80 counted the whole first reading as today's, which is wrong on phones whose sensor does not
                  // start from zero at power-on (vivo): start over once, without the steps it added
                  if (!p.getBoolean("v3", false)) p.edit().remove("last").remove("lastT").remove("days").putBoolean("v3", true).commit();
                  JSONObject days = new JSONObject(p.getString("days", "{}"));
                  long last = p.getLong("last", -1), lastT = p.getLong("lastT", 0);
                  String today = day(now);
                  if (last >= 0) {                       // the very first reading is only the starting point: what it includes differs by phone
                      long delta = count >= last ? count - last : count;      // smaller: the phone was restarted
                      if (delta > 0 && delta < 100000) {
                          String d0 = day(lastT), d1 = day(now);
                          if (d0.equals(d1) || now - lastT > 36 * 3600 * 1000L) days.put(d1, days.optLong(d1) + delta);
                          else {
                              // the interval crosses midnight: split it by time
                              Calendar mid = Calendar.getInstance(); mid.setTimeInMillis(now);
                              mid.set(Calendar.HOUR_OF_DAY, 0); mid.set(Calendar.MINUTE, 0); mid.set(Calendar.SECOND, 0); mid.set(Calendar.MILLISECOND, 0);
                              long before = Math.round(delta * (double) (mid.getTimeInMillis() - lastT) / (now - lastT));
                              days.put(d0, days.optLong(d0) + before);
                              days.put(d1, days.optLong(d1) + delta - before);
                          }
                      }
                  }
                  if (!days.has(today)) days.put(today, 0);    // today shows up even before the first step
                  // keep about four months
                  String old = day(now - 120L * 24 * 3600 * 1000);
                  for (Iterator<String> it = days.keys(); it.hasNext(); ) if (it.next().compareTo(old) < 0) it.remove();
                  p.edit().putLong("last", count).putLong("lastT", now).putString("days", days.toString()).apply();
              }

              @Override
              public void onReceive(Context c, Intent intent) {
                  final PendingResult res = goAsync();
                  sample(c, new Runnable() { public void run() { res.finish(); } });
              }
          }
