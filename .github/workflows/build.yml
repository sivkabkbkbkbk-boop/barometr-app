          package ru.barometr.neba;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import androidx.core.app.NotificationCompat;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          // "Reliable mode": a quiet line in the shade keeps the app from being frozen by strict phones (vivo, Xiaomi…),
          // so the mood questions come on time. It also asks by itself when the next time comes, as a second path.
          public class MoodKeep extends Service {
              static final String CH = "keep_quiet";
              static final int NID = 7310;
              static MoodKeep live;
              final Handler h = new Handler(Looper.getMainLooper());
              static void refresh(Context c) { refresh(c, false); }
              static void refresh(Context c, boolean alert) {       // alert: ring once, the question has just come
                  MoodKeep k = live; if (k == null) return;
                  try { ((NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE)).notify(NID, k.build(alert)); } catch (Exception e) { }
              }
              static boolean asking(Context c) {      // a question waits for an answer: until a smiley is pressed or the next question is due
                  SharedPreferences s = MoodNotify.prefs(c);
                  long ask = s.getLong("askPending", 0), now = System.currentTimeMillis();
                  int every = Math.max(30, Math.min(180, s.getInt("every", 60)));
                  return ask > 0 && ask > s.getLong("lastMark", 0) && now - ask < every * 60000L;
              }
              final Runnable tick = new Runnable() { public void run() { check(); } };

              static boolean wanted(Context c) {
                  SharedPreferences s = MoodNotify.prefs(c);
                  return s.getBoolean("keep", false) && s.getInt("every", 0) > 0;
              }
              static void sync(Context c) {           // start or stop, as the settings say
                  Intent i = new Intent(c, MoodKeep.class);
                  try {
                      if (wanted(c)) { if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(i); else c.startService(i); }
                      else c.stopService(i);
                  } catch (Exception e) { MoodNotify.prefs(c).edit().putString("keepErr", e.toString()).apply(); }
              }

              Notification build() { return build(false); }
              Notification build(boolean alert) {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CH, "Надёжные напоминания", NotificationManager.IMPORTANCE_MIN);
                      ch.setDescription("Тихая строка, чтобы телефон не усыплял приложение и вопросы приходили вовремя");
                      ch.setShowBadge(false);
                      nm.createNotificationChannel(ch);
                  }
                  SharedPreferences s = MoodNotify.prefs(this);
                  if (asking(this)) {
                      MoodNotify.channel(this);
                      return MoodNotify.question(this, MoodNotify.CH).setOngoing(true).setOnlyAlertOnce(!alert).setAutoCancel(false).build();
                  }
                  long next = MoodNotify.nextAt(this, System.currentTimeMillis());
                  String wx = s.getString("keepText", "");
                  String when = next > 0 ? "Следующий вопрос о самочувствии в " + new SimpleDateFormat("HH:mm", Locale.getDefault()).format(new Date(next)) : "Вопросы о самочувствии";
                  Intent open = getPackageManager().getLaunchIntentForPackage(getPackageName());
                  PendingIntent pi = PendingIntent.getActivity(this, 5, open != null ? open : new Intent(this, MainActivity.class), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  return new NotificationCompat.Builder(this, CH)
                      .setSmallIcon(R.drawable.ic_stat_barometr)
                      .setColor(0xFFFFB04A)
                      .setContentTitle(wx.isEmpty() ? "Не18мнеуже" : wx)
                      .setContentText(when)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setShowWhen(false)
                      .setPriority(NotificationCompat.PRIORITY_MIN)
                      .setCategory(NotificationCompat.CATEGORY_SERVICE)
                      .build();
              }

              // the time has come and the alarm has not answered: ask the same way it would
              void check() {
                  SharedPreferences s = MoodNotify.prefs(this);
                  long due = s.getLong("next", 0), fired = s.getLong("lastFire", 0), now = System.currentTimeMillis();
                  if (due > 0 && now >= due + 45000 && fired < due) new MoodAlarmReceiver().onReceive(this, new Intent());
                  try { ((NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE)).notify(NID, build()); } catch (Exception e) { }
                  h.removeCallbacks(tick); h.postDelayed(tick, 30000);
              }

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  if (!wanted(this)) { stopSelf(); return START_NOT_STICKY; }
                  try {
                      if (Build.VERSION.SDK_INT >= 34) startForeground(NID, build(), ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                      else startForeground(NID, build());
                  } catch (Exception e) { MoodNotify.prefs(this).edit().putString("keepErr", e.toString()).apply(); stopSelf(); return START_NOT_STICKY; }
                  live = this;
                  MoodNotify.prefs(this).edit().putLong("keepSince", System.currentTimeMillis()).putString("keepErr", "").apply();
                  MoodNotify.schedule(this);
                  h.removeCallbacks(tick); h.postDelayed(tick, 30000);
                  return START_STICKY;
              }
              @Override public void onDestroy() { h.removeCallbacks(tick); if (live == this) live = null; super.onDestroy(); }
              @Override public IBinder onBind(Intent i) { return null; }
          }
