name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Подготовка веб-части
        run: |
          mkdir -p www
          cp index.html www/
          cp icon-*.png www/ 2>/dev/null || true
          [ -f manifest.webmanifest ] && cp manifest.webmanifest www/ || true

      - name: Установка Capacitor
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 @capacitor/app@6 @capacitor/preferences@6 @capacitor/share@6 @capacitor/clipboard@6
          npx cap init "Не18мнеуже" ru.barometr.neba --web-dir=www
          npx cap add android
          # the build number becomes the Android version: a new APK installs over the old one as an update
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          # always sign with the debug.keystore from this repository, so every new APK installs over the old one
          sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile rootProject.file("..\/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' android/app/build.gradle
          grep -A7 "signingConfigs" android/app/build.gradle
          npx cap sync android

      - name: Разрешения, цвета, иконка
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>|' $M
          sed -i '0,/<\/activity>/s|</activity>|    <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="barometr" />\n            </intent-filter>\n        </activity>|' $M
          # native parts: in-app update and the "how do you feel" notification with all smileys
          J=android/app/src/main/java/ru/barometr/neba
          L=android/app/src/main/res/layout
          mkdir -p $J $L
          cat > $J/ApkUpdatePlugin.java <<'JAVA'
          package ru.barometr.neba;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          // Downloads a new APK of this app inside the app and hands it to the Android installer.
          // Android always asks the owner to confirm the update; this only removes the browser step.
          @CapacitorPlugin(name = "ApkUpdate")
          public class ApkUpdatePlugin extends Plugin {

              private File apkFile() {
                  File dir = new File(getContext().getCacheDir(), "updates");
                  dir.mkdirs();
                  return new File(dir, "update.apk");
              }

              @PluginMethod
              public void download(final PluginCall call) {
                  final String url = call.getString("url");
                  if (url == null || !url.startsWith("https://")) { call.reject("bad url"); return; }
                  new Thread(new Runnable() { public void run() {
                      HttpURLConnection c = null;
                      try {
                          File f = apkFile();
                          if (f.exists()) f.delete();
                          URL u = new URL(url);
                          int hops = 0;
                          while (true) {
                              c = (HttpURLConnection) u.openConnection();
                              c.setInstanceFollowRedirects(false);
                              c.setConnectTimeout(20000);
                              c.setReadTimeout(40000);
                              int code = c.getResponseCode();
                              if (code >= 300 && code < 400 && hops < 8) {
                                  String loc = c.getHeaderField("Location");
                                  c.disconnect();
                                  u = new URL(u, loc);
                                  hops++;
                                  continue;
                              }
                              if (code != 200) throw new IOException("HTTP " + code);
                              break;
                          }
                          long total = c.getContentLengthLong();
                          long done = 0;
                          int last = -1;
                          InputStream in = c.getInputStream();
                          OutputStream out = new FileOutputStream(f);
                          try {
                              byte[] buf = new byte[65536];
                              int n;
                              while ((n = in.read(buf)) > 0) {
                                  out.write(buf, 0, n);
                                  done += n;
                                  int pct = total > 0 ? (int) (done * 100 / total) : -1;
                                  if (pct != last) {
                                      last = pct;
                                      JSObject p = new JSObject();
                                      p.put("pct", pct);
                                      p.put("done", done);
                                      notifyListeners("progress", p);
                                  }
                              }
                          } finally {
                              out.close();
                              in.close();
                          }
                          if (done < 100000) throw new IOException("file too small");
                          JSObject r = new JSObject();
                          r.put("size", done);
                          call.resolve(r);
                      } catch (Exception e) {
                          call.reject(String.valueOf(e.getMessage()));
                      } finally {
                          if (c != null) c.disconnect();
                      }
                  }}).start();
              }

              @PluginMethod
              public void canInstall(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("ok", Build.VERSION.SDK_INT < 26 || getContext().getPackageManager().canRequestPackageInstalls());
                  call.resolve(r);
              }

              @PluginMethod
              public void openInstallSettings(PluginCall call) {
                  Intent i = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getContext().getPackageName()));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(i);
                  call.resolve();
              }

              @PluginMethod
              public void install(PluginCall call) {
                  try {
                      File f = apkFile();
                      if (!f.exists()) { call.reject("no file"); return; }
                      Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", f);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(uri, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          JAVA
          cat > $J/MoodNotify.java <<'JAVA'
          package ru.barometr.neba;

          import android.app.AlarmManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.view.View;
          import android.widget.RemoteViews;
          import androidx.core.app.NotificationCompat;
          import java.util.Calendar;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // "How do you feel?" in the notification shade: all smileys right in the notification,
          // repeated every N minutes within the hours the user chose.
          public class MoodNotify {
              static final String PREFS = "mood_notify";
              static final String CH = "mood_ask";
              static final int NID = 7301;
              static final int FLAGS = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;
              static final String DEF_KINDS = "[{\"k\":\"great\",\"e\":\"😄\",\"l\":\"Отлично\"},{\"k\":\"good\",\"e\":\"🙂\",\"l\":\"Норм\"},{\"k\":\"meh\",\"e\":\"😐\",\"l\":\"Так себе\"},{\"k\":\"sleepy\",\"e\":\"😴\",\"l\":\"Сонный\"},{\"k\":\"weak\",\"e\":\"🥴\",\"l\":\"Слабость\"},{\"k\":\"head\",\"e\":\"🤕\",\"l\":\"Голова\"},{\"k\":\"dizzy\",\"e\":\"😵‍💫\",\"l\":\"Кружится\"},{\"k\":\"heart\",\"e\":\"💓\",\"l\":\"Сердце\"},{\"k\":\"joints\",\"e\":\"🦴\",\"l\":\"Суставы\"},{\"k\":\"bad\",\"e\":\"😣\",\"l\":\"Плохо\"}]";

              static SharedPreferences prefs(Context c) { return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE); }

              static JSONArray kinds(Context c) {
                  try { return new JSONArray(prefs(c).getString("kinds", DEF_KINDS)); }
                  catch (Exception e) { try { return new JSONArray(DEF_KINDS); } catch (Exception e2) { return new JSONArray(); } }
              }

              static JSONObject kind(Context c, String k) {
                  JSONArray a = kinds(c);
                  for (int i = 0; i < a.length(); i++) { JSONObject o = a.optJSONObject(i); if (o != null && k.equals(o.optString("k"))) return o; }
                  return null;
              }

              // next moment to ask: every `every` minutes from `from` to `to` (minutes of the day); every >= 1440 means once a day at `from`
              static long nextAt(Context c, long now) {
                  SharedPreferences s = prefs(c);
                  int every = s.getInt("every", 0);
                  if (every <= 0) return -1;
                  int from = s.getInt("from", 540), to = s.getInt("to", 1320);
                  for (int day = 0; day < 3; day++) {
                      Calendar d = Calendar.getInstance();
                      d.setTimeInMillis(now);
                      d.add(Calendar.DAY_OF_YEAR, day);
                      d.set(Calendar.HOUR_OF_DAY, 0); d.set(Calendar.MINUTE, 0); d.set(Calendar.SECOND, 0); d.set(Calendar.MILLISECOND, 0);
                      if (every >= 1440) {
                          d.add(Calendar.MINUTE, from);
                          if (d.getTimeInMillis() > now + 30000) return d.getTimeInMillis();
                          continue;
                      }
                      for (int m = from; m <= to; m += every) {
                          Calendar t = (Calendar) d.clone();
                          t.add(Calendar.MINUTE, m);
                          if (t.getTimeInMillis() > now + 30000) return t.getTimeInMillis();
                      }
                  }
                  return -1;
              }

              static void schedule(Context c) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  PendingIntent pi = PendingIntent.getBroadcast(c, 1, new Intent(c, MoodAlarmReceiver.class), FLAGS);
                  am.cancel(pi);
                  long t = nextAt(c, System.currentTimeMillis());
                  if (t <= 0) return;
                  if (Build.VERSION.SDK_INT >= 23) am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, pi);
                  else am.set(AlarmManager.RTC_WAKEUP, t, pi);
              }

              static void channel(Context c) {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      NotificationChannel ch = new NotificationChannel(CH, "Как вы себя чувствуете", NotificationManager.IMPORTANCE_HIGH);
                      ch.setDescription("Вопрос о самочувствии со смайликами прямо в шторке");
                      nm.createNotificationChannel(ch);
                  }
              }

              static PendingIntent markIntent(Context c, String k, int rc) {
                  Intent i = new Intent(c, MoodMarkReceiver.class);
                  i.putExtra("k", k);
                  return PendingIntent.getBroadcast(c, 100 + rc, i, FLAGS);
              }

              static PendingIntent openApp(Context c) {
                  Intent open = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
                  if (open == null) open = new Intent(c, MainActivity.class);
                  open.putExtra("moodAsk", true);
                  return PendingIntent.getActivity(c, 2, open, FLAGS);
              }

              static final int[] SMALL = {R.id.s0, R.id.s1, R.id.s2, R.id.s3, R.id.s4};
              static final int[] SMALL_PICK = {0, 1, 2, 5, 9};
              static final int[] CELL = {R.id.c0, R.id.c1, R.id.c2, R.id.c3, R.id.c4, R.id.c5, R.id.c6, R.id.c7, R.id.c8, R.id.c9};
              static final int[] EMO = {R.id.e0, R.id.e1, R.id.e2, R.id.e3, R.id.e4, R.id.e5, R.id.e6, R.id.e7, R.id.e8, R.id.e9};
              static final int[] LAB = {R.id.l0, R.id.l1, R.id.l2, R.id.l3, R.id.l4, R.id.l5, R.id.l6, R.id.l7, R.id.l8, R.id.l9};

              static void post(Context c) {
                  channel(c);
                  JSONArray a = kinds(c);
                  RemoteViews small = new RemoteViews(c.getPackageName(), R.layout.mood_small);
                  for (int i = 0; i < SMALL.length; i++) {
                      JSONObject o = a.optJSONObject(SMALL_PICK[i]);
                      if (o == null) { small.setViewVisibility(SMALL[i], View.GONE); continue; }
                      small.setTextViewText(SMALL[i], o.optString("e"));
                      small.setOnClickPendingIntent(SMALL[i], markIntent(c, o.optString("k"), i));
                  }
                  RemoteViews big = new RemoteViews(c.getPackageName(), R.layout.mood_big);
                  for (int i = 0; i < CELL.length; i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (o == null) { big.setViewVisibility(CELL[i], View.INVISIBLE); continue; }
                      big.setTextViewText(EMO[i], o.optString("e"));
                      big.setTextViewText(LAB[i], o.optString("l"));
                      big.setOnClickPendingIntent(CELL[i], markIntent(c, o.optString("k"), 20 + i));
                  }
                  NotificationCompat.Builder b = new NotificationCompat.Builder(c, CH)
                      .setSmallIcon(R.drawable.ic_stat_barometr)
                      .setColor(0xFFFFB04A)
                      .setContentTitle("Как себя чувствуешь?")
                      .setContentText("Нажми на смайлик")
                      .setSubText("Как себя чувствуешь?")
                      .setStyle(new NotificationCompat.DecoratedCustomViewStyle())
                      .setCustomContentView(small)
                      .setCustomBigContentView(big)
                      .setContentIntent(openApp(c))
                      .setAutoCancel(true)
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setCategory(NotificationCompat.CATEGORY_REMINDER);
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  try { nm.notify(NID, b.build()); } catch (SecurityException e) { /* notifications not allowed */ }
              }

              static void confirm(Context c, String k) {
                  JSONObject o = kind(c, k);
                  String title = (o != null ? o.optString("e") + " " + o.optString("l") : "Отметка") + " — записано";
                  NotificationCompat.Builder b = new NotificationCompat.Builder(c, CH)
                      .setSmallIcon(R.drawable.ic_stat_barometr)
                      .setColor(0xFFFFB04A)
                      .setContentTitle(title)
                      .setContentText("Сохранено в дневнике самочувствия")
                      .setContentIntent(openApp(c))
                      .setOnlyAlertOnce(true)
                      .setAutoCancel(true)
                      .setTimeoutAfter(4000)
                      .setPriority(NotificationCompat.PRIORITY_LOW);
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  try { nm.notify(NID, b.build()); } catch (SecurityException e) { }
              }
          }
          JAVA
          cat > $J/MoodNotifyPlugin.java <<'JAVA'
          package ru.barometr.neba;

          import android.content.SharedPreferences;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "MoodNotify")
          public class MoodNotifyPlugin extends Plugin {
              static MoodNotifyPlugin inst;

              @Override
              public void load() { inst = this; }

              // tells the open app that a smiley was pressed in the shade; the app then calls takePending
              static void emit() {
                  MoodNotifyPlugin p = inst;
                  if (p != null) p.notifyListeners("mark", new JSObject());
              }

              @PluginMethod
              public void configure(PluginCall call) {
                  SharedPreferences.Editor e = MoodNotify.prefs(getContext()).edit();
                  e.putInt("every", call.getInt("every", 0));
                  e.putInt("from", call.getInt("from", 540));
                  e.putInt("to", call.getInt("to", 1320));
                  JSArray k = call.getArray("kinds");
                  if (k != null && k.length() > 0) e.putString("kinds", k.toString());
                  e.apply();
                  MoodNotify.channel(getContext());
                  MoodNotify.schedule(getContext());
                  JSObject r = new JSObject();
                  r.put("next", MoodNotify.nextAt(getContext(), System.currentTimeMillis()));
                  call.resolve(r);
              }

              @PluginMethod
              public void noteMark(PluginCall call) {
                  MoodNotify.prefs(getContext()).edit().putLong("lastMark", System.currentTimeMillis()).apply();
                  call.resolve();
              }

              @PluginMethod
              public void test(PluginCall call) {
                  MoodNotify.post(getContext());
                  call.resolve();
              }

              @PluginMethod
              public void takePending(PluginCall call) {
                  SharedPreferences s = MoodNotify.prefs(getContext());
                  String v = s.getString("pending", "[]");
                  s.edit().putString("pending", "[]").apply();
                  JSObject r = new JSObject();
                  try { r.put("marks", new JSArray(v)); } catch (Exception ex) { r.put("marks", new JSArray()); }
                  call.resolve(r);
              }
          }
          JAVA
          cat > $J/MoodAlarmReceiver.java <<'JAVA'
          package ru.barometr.neba;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import java.util.Calendar;

          // fires at each chosen time: asks unless the user marked their mood very recently, then plans the next time
          public class MoodAlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent intent) {
                  SharedPreferences s = MoodNotify.prefs(c);
                  int every = s.getInt("every", 0);
                  long last = s.getLong("lastMark", 0), now = System.currentTimeMillis();
                  boolean recent;
                  if (every >= 1440) {
                      Calendar a = Calendar.getInstance(), b = Calendar.getInstance();
                      a.setTimeInMillis(last); b.setTimeInMillis(now);
                      recent = a.get(Calendar.YEAR) == b.get(Calendar.YEAR) && a.get(Calendar.DAY_OF_YEAR) == b.get(Calendar.DAY_OF_YEAR);
                  } else {
                      recent = now - last < every * 60000L / 2;
                  }
                  if (every > 0 && !recent) MoodNotify.post(c);
                  MoodNotify.schedule(c);
              }
          }
          JAVA
          cat > $J/MoodMarkReceiver.java <<'JAVA'
          package ru.barometr.neba;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // a smiley pressed in the notification: keep it until the app picks it up, show "recorded"
          public class MoodMarkReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent intent) {
                  String k = intent.getStringExtra("k");
                  if (k == null) return;
                  long now = System.currentTimeMillis();
                  SharedPreferences s = MoodNotify.prefs(c);
                  try {
                      JSONArray a = new JSONArray(s.getString("pending", "[]"));
                      JSONObject o = new JSONObject();
                      o.put("k", k);
                      o.put("t", now);
                      a.put(o);
                      s.edit().putString("pending", a.toString()).putLong("lastMark", now).apply();
                  } catch (Exception e) { }
                  MoodNotify.confirm(c, k);
                  MoodNotifyPlugin.emit();
              }
          }
          JAVA
          cat > $J/MoodBootReceiver.java <<'JAVA'
          package ru.barometr.neba;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          // alarms are lost on reboot and on app update: plan the next question again
          public class MoodBootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent intent) {
                  MoodNotify.schedule(c);
              }
          }
          JAVA
          cat > $J/MainActivity.java <<'JAVA'
          package ru.barometr.neba;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ApkUpdatePlugin.class);
                  registerPlugin(MoodNotifyPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
