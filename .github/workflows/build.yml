          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          // alarms are lost on reboot and on app update: plan the next question and the update check again
          public class MoodBootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent intent) {
                  MoodNotify.schedule(c);
                  MoodKeep.sync(c);
                  UpdateCheck.reschedule(c);
                  ChatWatch.schedule(c);
                  IconSwitch.schedule(c);
                  IconSwitch.apply(c, IconSwitch.levelNow(c));
                  FcNotify.schedule(c);
                  PhoneSteps.schedule(c);
              }
