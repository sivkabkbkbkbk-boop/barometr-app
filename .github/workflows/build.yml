          # home-screen widget 2x1: weather, pressure and the Kp index
          cat > $J/WxWidget.java <<'JAVA'
          package ru.barometr.neba;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // Home-screen widget 2x1 on a background that shows the weather of the current hour (drawn by
          // widget/frames.py; with animation on, the launcher flips its 20 frames 10 times a second while it is on screen).
          // Text: city, the day's high and low, temperature, pressure with its change over the last 3 hours, and Kp.
          // The app leaves an hourly plan for two days; each update picks the current hour.
          public class WxWidget extends AppWidgetProvider {
              static final String PREFS = "wx_widget";
              static final long HOUR = 3600 * 1000L;
              static final int FRAMES = 20;
              static final int GREEN = 0xFFB6FFB9, YELLOW = 0xFFFFE28A, RED = 0xFFFFB3A8, DIM = 0xBFFFFFFF;

              static SharedPreferences prefs(Context c) { return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE); }

              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  for (int id : ids) m.updateAppWidget(id, build(c));
              }

              static void refresh(Context c) {
                  AppWidgetManager m = AppWidgetManager.getInstance(c);
                  int[] ids = m.getAppWidgetIds(new ComponentName(c, WxWidget.class));
                  if (ids == null) return;
                  for (int id : ids) m.updateAppWidget(id, build(c));
              }

              static String scene(String k, boolean night) {
                  if ("clear".equals(k)) return night ? "clear_n" : "clear_d";
                  if ("fair".equals(k) || "partly".equals(k)) return night ? "fair_n" : "fair_d";
                  if ("rain".equals(k) || "snow".equals(k) || "thunder".equals(k) || "fog".equals(k)) return k;
                  return "cloud";
              }

              static String deg(int t) { return (t > 0 ? "+" : "") + t + "°"; }

              static JSONObject nearest(JSONArray s, long at) {
                  JSONObject best = null;
                  long bd = Long.MAX_VALUE;
                  for (int i = 0; i < s.length(); i++) {
                      JSONObject o = s.optJSONObject(i);
                      if (o == null) continue;
                      long d = Math.abs(o.optLong("t") - at);
                      if (d < bd) { bd = d; best = o; }
                  }
                  return bd <= 2 * HOUR ? best : null;
              }

              static void frames(Context c, RemoteViews v, String scene, boolean anim) {
                  String pkg = c.getPackageName();
                  for (int f = 0; f < (anim ? FRAMES : 1); f++) {
                      int img = c.getResources().getIdentifier("wxf_" + scene + "_" + (f < 10 ? "0" : "") + f, "drawable", pkg);
                      int view = c.getResources().getIdentifier("wx_f" + f, "id", pkg);
                      if (img != 0 && view != 0) v.setImageViewResource(view, img);
                  }
              }

              static RemoteViews build(Context c) {
                  SharedPreferences p = prefs(c);
                  boolean anim = p.getBoolean("anim", true);
                  RemoteViews v = new RemoteViews(c.getPackageName(), anim ? R.layout.wx_widget_anim : R.layout.wx_widget);
                  Intent open = new Intent(c, MainActivity.class);
                  open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  v.setOnClickPendingIntent(android.R.id.background, PendingIntent.getActivity(c, 30, open,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
                  try {
                      JSONObject d = new JSONObject(p.getString("data", "{}"));
                      JSONArray s = d.optJSONArray("slots");
                      long now = System.currentTimeMillis();
                      JSONObject o = s == null ? null : nearest(s, now);
                      if (o == null) throw new Exception("no data for now");
                      frames(c, v, scene(o.optString("k"), o.optBoolean("n")), anim);
                      v.setTextViewText(R.id.wx_city, d.optString("city", ""));
                      v.setTextViewText(R.id.wx_temp, deg(o.optInt("tp")));
                      JSONObject days = d.optJSONObject("days");
                      JSONArray hl = days == null ? null : days.optJSONArray(new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(new Date(now)));
                      v.setTextViewText(R.id.wx_hilo, hl == null ? "" : deg(hl.optInt(0)) + " " + deg(hl.optInt(1)));
                      // pressure now, and how it changed over the last 3 hours: the arrow shows where it went,
                      // green when slowly (under 2 mm in 3 h), red when fast
                      if (o.has("p")) {
                          double pr = o.optDouble("p");
                          JSONObject before = nearest(s, o.optLong("t") - 3 * HOUR);
                          double dp = before != null && before.has("p") && before != o ? pr - before.optDouble("p") : 0;
                          v.setTextViewText(R.id.wx_press, Math.round(pr) + " ");
                          if (Math.abs(dp) < 0.5) {
                              v.setTextViewText(R.id.wx_parr, "→");
                              v.setTextColor(R.id.wx_parr, DIM);
                          } else {
                              long n = Math.max(1, Math.round(Math.abs(dp)));
                              v.setTextViewText(R.id.wx_parr, (dp > 0 ? "↑" : "↓") + n);
                              v.setTextColor(R.id.wx_parr, Math.abs(dp) >= 2 ? RED : GREEN);
                          }
                      } else {
                          v.setTextViewText(R.id.wx_press, "—");
                          v.setTextViewText(R.id.wx_parr, "");
                      }
                      if (o.has("kp")) {
                          double kp = o.optDouble("kp");
                          v.setTextColor(R.id.wx_kpdot, kp >= 5 ? RED : kp >= 4 ? YELLOW : GREEN);
                          v.setTextViewText(R.id.wx_kp, "Kp " + Math.round(kp) + (kp >= 5 ? " буря" : ""));
                      } else {
                          v.setTextColor(R.id.wx_kpdot, DIM);
                          v.setTextViewText(R.id.wx_kp, "Kp —");
                      }
                  } catch (Exception e) {
                      frames(c, v, "cloud", anim);
                      v.setTextViewText(R.id.wx_city, "Не18мнеуже");
                      v.setTextViewText(R.id.wx_hilo, "");
                      v.setTextViewText(R.id.wx_temp, "");
                      v.setTextViewText(R.id.wx_press, "Откройте");
                      v.setTextViewText(R.id.wx_parr, "");
                      v.setTextColor(R.id.wx_kpdot, 0x00000000);
                      v.setTextViewText(R.id.wx_kp, "приложение");
                  }
                  return v;
              }
          }
