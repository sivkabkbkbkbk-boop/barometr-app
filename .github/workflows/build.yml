          cat > $J/PhoneStepsPlugin.java <<'JAVA'
          package ru.barometr.neba;

          import android.Manifest;
          import android.os.Build;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "PhoneSteps", permissions = { @Permission(strings = { Manifest.permission.ACTIVITY_RECOGNITION }, alias = "activity") })
          public class PhoneStepsPlugin extends Plugin {
              private boolean granted() { return Build.VERSION.SDK_INT < 29 || getPermissionState("activity") == PermissionState.GRANTED; }

              @PluginMethod
              public void status(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("sensor", PhoneSteps.hasSensor(getContext()));
                  r.put("granted", granted());
                  r.put("on", PhoneSteps.prefs(getContext()).getBoolean("on", false));
                  r.put("since", PhoneSteps.prefs(getContext()).getLong("since", 0));
                  call.resolve(r);
              }

              // switch counting on (asks for "physical activity" first) or off
              @PluginMethod
              public void start(PluginCall call) {
                  if (!call.getBoolean("on", true)) { PhoneSteps.prefs(getContext()).edit().putBoolean("on", false).apply(); PhoneSteps.schedule(getContext()); call.resolve(); return; }
                  if (!granted()) { requestPermissionForAlias("activity", call, "onPermission"); return; }
                  begin(call);
              }

              @PermissionCallback
              private void onPermission(PluginCall call) {
                  if (!granted()) { JSObject r = new JSObject(); r.put("granted", false); call.resolve(r); return; }
                  begin(call);
              }

              private void begin(final PluginCall call) {
                  if (PhoneSteps.prefs(getContext()).getLong("since", 0) == 0) PhoneSteps.prefs(getContext()).edit().putLong("since", System.currentTimeMillis()).apply();
                  PhoneSteps.prefs(getContext()).edit().putBoolean("on", true).apply();
                  PhoneSteps.schedule(getContext());
                  PhoneSteps.sample(getContext(), new Runnable() { public void run() {
                      JSObject r = new JSObject(); r.put("granted", true); call.resolve(r);
                  }});
              }

              // days: {"yyyy-mm-dd": steps}, after a fresh reading
              @PluginMethod
              public void read(final PluginCall call) {
                  if (!granted() || !PhoneSteps.prefs(getContext()).getBoolean("on", false)) { JSObject r = new JSObject(); r.put("days", new JSObject()); call.resolve(r); return; }
                  PhoneSteps.sample(getContext(), new Runnable() { public void run() {
                      JSObject r = new JSObject();
                      try { r.put("days", new JSObject(PhoneSteps.prefs(getContext()).getString("days", "{}"))); } catch (Exception e) { r.put("days", new JSObject()); }
                      call.resolve(r);
                  }});
              }
          }
