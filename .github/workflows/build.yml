name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Подготовка веб-части
        run: |
          mkdir -p www
          cp index.html www/
          cp icon-*.png www/ 2>/dev/null || true
          [ -f manifest.webmanifest ] && cp manifest.webmanifest www/ || true

      - name: Установка Capacitor
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 @capacitor/app@6 @capacitor/preferences@6 @capacitor/share@6 @capacitor/clipboard@6
          # the vector base map of the precipitation map
          npm install maplibre-gl@4
          cp node_modules/maplibre-gl/dist/maplibre-gl.js node_modules/maplibre-gl/dist/maplibre-gl.css www/
          npx cap init "Не18мнеуже" ru.barometr.neba --web-dir=www
          npx cap add android
          # the build number becomes the Android version: a new APK installs over the old one as an update
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          # always sign with the debug.keystore from this repository, so every new APK installs over the old one
          sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile rootProject.file("..\/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' android/app/build.gradle
          grep -A7 "signingConfigs" android/app/build.gradle
          npx cap sync android

      - name: Разрешения, цвета, иконка
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n</manifest>|' $M
          sed -i '0,/<\/activity>/s|</activity>|    <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="barometr" />\n            </intent-filter>\n        </activity>|' $M
          # native parts: in-app update, daily update check, chat notifications, weather icon and the "how do you feel" notification
          J=android/app/src/main/java/ru/barometr/neba
          L=android/app/src/main/res/layout
          mkdir -p $J $L
          # the mood faces in thin lines for the notification, taken from the app (index.html)
          python3 widget/faces.py android/app/src/main/res
          cat > $J/ApkUpdatePlugin.java <<'JAVA'
          package ru.barometr.neba;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          // Downloads a new APK of this app inside the app and hands it to the Android installer.
          // Android always asks the owner to confirm the update; this only removes the browser step.
          @CapacitorPlugin(name = "ApkUpdate")
          public class ApkUpdatePlugin extends Plugin {

              private File apkFile() {
                  File dir = new File(getContext().getCacheDir(), "updates");
                  dir.mkdirs();
                  return new File(dir, "update.apk");
              }

              @PluginMethod
              public void download(final PluginCall call) {
                  final String url = call.getString("url");
                  if (url == null || !url.startsWith("https://")) { call.reject("bad url"); return; }
                  new Thread(new Runnable() { public void run() {
                      HttpURLConnection c = null;
                      try {
                          File f = apkFile();
                          if (f.exists()) f.delete();
                          URL u = new URL(url);
                          int hops = 0;
                          while (true) {
                              c = (HttpURLConnection) u.openConnection();
                              c.setInstanceFollowRedirects(false);
                              c.setConnectTimeout(20000);
                              c.setReadTimeout(40000);
                              int code = c.getResponseCode();
                              if (code >= 300 && code < 400 && hops < 8) {
                                  String loc = c.getHeaderField("Location");
                                  c.disconnect();
                                  u = new URL(u, loc);
                                  hops++;
                                  continue;
                              }
                              if (code != 200) throw new IOException("HTTP " + code);
                              break;
                          }
                          long total = c.getContentLengthLong();
                          long done = 0;
                          int last = -1;
                          InputStream in = c.getInputStream();
                          OutputStream out = new FileOutputStream(f);
                          try {
                              byte[] buf = new byte[65536];
                              int n;
                              while ((n = in.read(buf)) > 0) {
                                  out.write(buf, 0, n);
                                  done += n;
                                  int pct = total > 0 ? (int) (done * 100 / total) : -1;
                                  if (pct != last) {
                                      last = pct;
                                      JSObject p = new JSObject();
                                      p.put("pct", pct);
                                      p.put("done", done);
                                      notifyListeners("progress", p);
                                  }
                              }
                          } finally {
                              out.close();
                              in.close();
                          }
                          if (done < 100000) throw new IOException("file too small");
                          JSObject r = new JSObject();
                          r.put("size", done);
                          call.resolve(r);
                      } catch (Exception e) {
                          call.reject(String.valueOf(e.getMessage()));
                      } finally {
                          if (c != null) c.disconnect();
                      }
                  }}).start();
              }

              // daily check for a new build in the background (off for the RuStore version: the store updates the app)
              @PluginMethod
              public void autoCheck(PluginCall call) {
                  UpdateCheck.schedule(getContext(), Boolean.TRUE.equals(call.getBoolean("on", true)));
                  call.resolve();
              }

              @PluginMethod
              public void canInstall(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("ok", Build.VERSION.SDK_INT < 26 || getContext().getPackageManager().canRequestPackageInstalls());
                  call.resolve(r);
              }

              @PluginMethod
              public void openInstallSettings(PluginCall call) {
                  Intent i = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getContext().getPackageName()));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(i);
                  call.resolve();
              }

              @PluginMethod
              public void install(PluginCall call) {
                  try {
                      File f = apkFile();
                      if (!f.exists()) { call.reject("no file"); return; }
                      Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", f);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(uri, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          JAVA
          cat > $J/UpdateCheck.java <<'JAVA'
          package ru.barometr.neba;

          import android.app.AlarmManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageInfo;
          import android.net.Uri;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import org.json.JSONObject;

          // Once a day, even when the app is closed: is there a newer build on GitHub? Then a notification;
          // tapping it opens the app, which downloads and installs the update.
          public class UpdateCheck {
              static final String PREFS = "upd_check";
              static final String CH = "updates";
              static final int NID = 7401;
              static final String API = "https://api.github.com/repos/sivkabkbkbkbk-boop/barometr-app/releases/latest";
              static final int FLAGS = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;

              static SharedPreferences prefs(Context c) { return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE); }

              static void schedule(Context c, boolean on) {
                  prefs(c).edit().putBoolean("on", on).apply();
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  PendingIntent pi = PendingIntent.getBroadcast(c, 3, new Intent(c, UpdateCheckReceiver.class), FLAGS);
                  am.cancel(pi);
                  if (!on) return;
                  am.setInexactRepeating(AlarmManager.RTC, System.currentTimeMillis() + 3 * AlarmManager.INTERVAL_HOUR, AlarmManager.INTERVAL_DAY, pi);
              }

              static void reschedule(Context c) { schedule(c, prefs(c).getBoolean("on", false)); }

              static long myBuild(Context c) {
                  try {
                      PackageInfo p = c.getPackageManager().getPackageInfo(c.getPackageName(), 0);
                      return Build.VERSION.SDK_INT >= 28 ? p.getLongVersionCode() : p.versionCode;
                  } catch (Exception e) { return 0; }
              }

              // runs on a background thread
              static void check(Context c) throws Exception {
                  HttpURLConnection con = (HttpURLConnection) new URL(API).openConnection();
                  con.setRequestProperty("Accept", "application/vnd.github+json");
                  con.setRequestProperty("User-Agent", "Ne18mneuzhe-app");
                  con.setConnectTimeout(20000);
                  con.setReadTimeout(20000);
                  try {
                      if (con.getResponseCode() != 200) return;
                      StringBuilder sb = new StringBuilder();
                      BufferedReader r = new BufferedReader(new InputStreamReader(con.getInputStream(), "UTF-8"));
                      String line;
                      while ((line = r.readLine()) != null) sb.append(line);
                      r.close();
                      Matcher m = Pattern.compile("build-(\\d+)").matcher(new JSONObject(sb.toString()).optString("tag_name"));
                      if (!m.find()) return;
                      long last = Long.parseLong(m.group(1));
                      if (last <= myBuild(c)) return;
                      SharedPreferences p = prefs(c);
                      if (p.getLong("notified", 0) >= last) return;   // tell about each build only once
                      post(c, last);
                      p.edit().putLong("notified", last).apply();
                  } finally {
                      con.disconnect();
                  }
              }

              static void post(Context c, long build) {
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CH, "Обновления приложения", NotificationManager.IMPORTANCE_DEFAULT);
                      ch.setDescription("Сообщает, когда вышла новая версия");
                      nm.createNotificationChannel(ch);
                  }
                  Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse("barometr://update"));
                  i.setPackage(c.getPackageName());
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  NotificationCompat.Builder b = new NotificationCompat.Builder(c, CH)
                      .setSmallIcon(R.drawable.ic_stat_barometr)
                      .setColor(0xFFFFB04A)
                      .setContentTitle("Вышло обновление «Не18мнеуже»")
                      .setContentText("Сборка " + build + " — нажмите, чтобы обновить")
                      .setContentIntent(PendingIntent.getActivity(c, 4, i, FLAGS))
                      .setAutoCancel(true)
                      .setPriority(NotificationCompat.PRIORITY_DEFAULT);
                  try { nm.notify(NID, b.build()); } catch (SecurityException e) { }
              }
          }
          JAVA
          cat > $J/UpdateCheckReceiver.java <<'JAVA'
          package ru.barometr.neba;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class UpdateCheckReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(final Context c, Intent intent) {
                  final PendingResult res = goAsync();
                  new Thread(new Runnable() { public void run() {
                      try { UpdateCheck.check(c); } catch (Exception e) { } finally { res.finish(); }
                  }}).start();
              }
          }
          JAVA
          cat > $J/ChatWatch.java <<'JAVA'
          package ru.barometr.neba;

          import android.app.AlarmManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.util.Base64;
          import androidx.core.app.NotificationCompat;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.ArrayList;
          import java.util.List;
          import javax.crypto.Cipher;
          import javax.crypto.spec.GCMParameterSpec;
          import javax.crypto.spec.SecretKeySpec;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // New chat messages while the app is closed: every ~5 minutes read each friend's chat.json on
          // Yandex Disk, open the messages meant for us with the key both friends share, and show them in the shade.
          public class ChatWatch {
              static final String PREFS = "chat_watch";
              static final String CH = "chat";
              static final int FLAGS = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;

              static SharedPreferences prefs(Context c) { return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE); }

              static void schedule(Context c) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  PendingIntent pi = PendingIntent.getBroadcast(c, 5, new Intent(c, ChatWatchReceiver.class), FLAGS);
                  am.cancel(pi);
                  if (!prefs(c).getBoolean("on", false)) return;
                  // every ~5 minutes; when the phone sleeps for long, Android itself stretches this to 10–15 minutes
                  am.setInexactRepeating(AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + 5 * 60 * 1000L, 5 * 60 * 1000L, pi);
              }

              static int nid(String k) { return 7500 + (k.hashCode() & 0x3ff); }

              static String get(String url) throws Exception {
                  HttpURLConnection con = (HttpURLConnection) new URL(url).openConnection();
                  con.setConnectTimeout(20000);
                  con.setReadTimeout(20000);
                  con.setRequestProperty("User-Agent", "Ne18mneuzhe-app");
                  try {
                      if (con.getResponseCode() != 200) return null;
                      StringBuilder sb = new StringBuilder();
                      BufferedReader r = new BufferedReader(new InputStreamReader(con.getInputStream(), "UTF-8"));
                      String line;
                      while ((line = r.readLine()) != null) sb.append(line);
                      r.close();
                      return sb.toString();
                  } finally { con.disconnect(); }
              }

              static JSONObject open(byte[] key, JSONObject m) throws Exception {
                  Cipher ci = Cipher.getInstance("AES/GCM/NoPadding");
                  ci.init(Cipher.DECRYPT_MODE, new SecretKeySpec(key, "AES"),
                      new GCMParameterSpec(128, Base64.decode(m.getString("iv"), Base64.DEFAULT)));
                  return new JSONObject(new String(ci.doFinal(Base64.decode(m.getString("c"), Base64.DEFAULT)), "UTF-8"));
              }

              // runs on a background thread
              static void check(Context c) throws Exception {
                  SharedPreferences p = prefs(c);
                  if (!p.getBoolean("on", false)) return;
                  JSONArray fr = new JSONArray(p.getString("friends", "[]"));
                  SharedPreferences.Editor ed = p.edit();
                  for (int i = 0; i < fr.length(); i++) {
                      JSONObject f = fr.optJSONObject(i);
                      if (f == null) continue;
                      String k = f.optString("k"), since = f.optString("since"), last = p.getString("n:" + k, "");
                      if (last.compareTo(since) > 0) since = last;
                      try {
                          String meta = get("https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key="
                              + URLEncoder.encode(k, "UTF-8") + "&path=" + URLEncoder.encode("/chat.json", "UTF-8"));
                          if (meta == null) continue;
                          String body = get(new JSONObject(meta).getString("href"));
                          if (body == null) continue;
                          JSONObject boxes = new JSONObject(body).optJSONObject("boxes");
                          JSONArray box = boxes == null ? null : boxes.optJSONArray(f.optString("box"));
                          if (box == null) continue;
                          byte[] key = Base64.decode(f.optString("key"), Base64.DEFAULT);
                          List<String> lines = new ArrayList<String>();
                          String newest = since;
                          for (int j = 0; j < box.length(); j++) {
                              JSONObject o;
                              try { o = open(key, box.getJSONObject(j)); } catch (Exception e) { continue; }
                              String t = o.optString("t");
                              if (t.compareTo(since) <= 0) continue;
                              String x = o.has("c") ? "📋 поделился(ась) состоянием" : o.optString("x");
                              if (x.length() > 120) x = x.substring(0, 120) + "…";
                              lines.add(x);
                              if (t.compareTo(newest) > 0) newest = t;
                          }
                          if (!lines.isEmpty()) {
                              int total = p.getInt("c:" + k, 0) + lines.size();
                              post(c, k, f.optString("n", "Друг"), lines, total);
                              ed.putString("n:" + k, newest).putInt("c:" + k, total);
                          }
                      } catch (Exception e) { }
                  }
                  ed.apply();
              }

              static void post(Context c, String k, String name, List<String> lines, int total) {
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CH, "Сообщения от друзей", NotificationManager.IMPORTANCE_HIGH);
                      ch.setDescription("Новые сообщения в чате");
                      ch.setShowBadge(true);
                      nm.createNotificationChannel(ch);
                  }
                  Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse("barometr://chat?k=" + Uri.encode(k)));
                  i.setPackage(c.getPackageName());
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  NotificationCompat.InboxStyle st = new NotificationCompat.InboxStyle();
                  for (String l : lines) st.addLine(l);
                  NotificationCompat.Builder b = new NotificationCompat.Builder(c, CH)
                      .setSmallIcon(R.drawable.ic_stat_barometr)
                      .setColor(0xFFFFB04A)
                      .setContentTitle(name)
                      .setContentText(lines.get(lines.size() - 1))
                      .setStyle(st)
                      .setNumber(total)
                      .setBadgeIconType(NotificationCompat.BADGE_ICON_SMALL)
                      .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                      .setContentIntent(PendingIntent.getActivity(c, nid(k), i, FLAGS))
                      .setAutoCancel(true)
                      .setPriority(NotificationCompat.PRIORITY_HIGH);
                  try { nm.notify(nid(k), b.build()); } catch (SecurityException e) { }
              }

              // the app has shown these messages: drop the notification and the counter
              static void clear(Context c, String k) {
                  prefs(c).edit().putInt("c:" + k, 0).apply();
                  ((NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE)).cancel(nid(k));
              }
          }
          JAVA
          cat > $J/ChatWatchReceiver.java <<'JAVA'
          package ru.barometr.neba;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class ChatWatchReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(final Context c, Intent intent) {
                  final PendingResult res = goAsync();
                  new Thread(new Runnable() { public void run() {
                      try { ChatWatch.check(c); } catch (Exception e) { } finally { res.finish(); }
                  }}).start();
              }
          }
          JAVA
          cat > $J/ChatWatchPlugin.java <<'JAVA'
          package ru.barometr.neba;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "ChatWatch")
          public class ChatWatchPlugin extends Plugin {
              // friends: [{k, n, box, key, since}] — what to watch and what the app has already shown
              @PluginMethod
              public void configure(PluginCall call) {
                  JSArray fr = call.getArray("friends");
                  boolean on = Boolean.TRUE.equals(call.getBoolean("on", true)) && fr != null && fr.length() > 0;
                  ChatWatch.prefs(getContext()).edit().putBoolean("on", on).putString("friends", fr == null ? "[]" : fr.toString()).apply();
                  // messages the app already has: no notification for them
                  if (fr != null) for (int i = 0; i < fr.length(); i++) {
                      JSONObject f = fr.optJSONObject(i);
                      if (f == null) continue;
                      String k = f.optString("k");
                      if (f.optString("since").compareTo(ChatWatch.prefs(getContext()).getString("n:" + k, "")) >= 0) ChatWatch.clear(getContext(), k);
                  }
                  ChatWatch.schedule(getContext());
                  call.resolve();
              }

              @PluginMethod
              public void clear(PluginCall call) {
                  String k = call.getString("k");
                  if (k != null) ChatWatch.clear(getContext(), k);
                  call.resolve();
              }

              @PluginMethod
              public void checkNow(PluginCall call) {
                  new Thread(new Runnable() { public void run() {
                      try { ChatWatch.check(getContext()); } catch (Exception e) { }
                  }}).start();
                  call.resolve();
              }
          }
          JAVA
          cat > $J/IconSwitch.java <<'JAVA'
          package ru.barometr.neba;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // The launcher icon follows the weather: calm / middle / hard. The app leaves a plan (level for each
          // 3-hour slot, computed with the same formula as the "today" card); every ~3 hours we pick the current one.
          public class IconSwitch {
              static final String PREFS = "icon_switch";
              static final String[] LEVELS = {"calm", "mid", "bad"};
              static final String[] ALIAS = {".IconCalm", ".IconMid", ".IconBad"};
              static final int FLAGS = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;

              static SharedPreferences prefs(Context c) { return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE); }

              static String levelNow(Context c) {
                  SharedPreferences p = prefs(c);
                  if (!p.getBoolean("on", false)) return "bad";
                  try {
                      JSONArray plan = new JSONArray(p.getString("plan", "[]"));
                      long now = System.currentTimeMillis();
                      String best = null;
                      long bestT = Long.MIN_VALUE;
                      for (int i = 0; i < plan.length(); i++) {
                          JSONObject o = plan.optJSONObject(i);
                          if (o == null) continue;
                          long t = o.optLong("t");
                          if (t <= now && t > bestT) { bestT = t; best = o.optString("l"); }
                      }
                      return best;   // null: the plan has run out, keep the icon as it is
                  } catch (Exception e) { return null; }
              }

              static void apply(Context c, String level) {
                  if (level == null) return;
                  int idx = -1;
                  for (int i = 0; i < LEVELS.length; i++) if (LEVELS[i].equals(level)) idx = i;
                  if (idx < 0) return;
                  SharedPreferences p = prefs(c);
                  if (level.equals(p.getString("cur", "bad"))) return;
                  PackageManager pm = c.getPackageManager();
                  String pkg = c.getPackageName();
                  // switch the new icon on first, then the others off, so there is always one on the home screen
                  pm.setComponentEnabledSetting(new ComponentName(pkg, pkg + ALIAS[idx]),
