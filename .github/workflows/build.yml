          import androidx.core.app.NotificationCompat;
          import java.util.Calendar;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // "How do you feel?" in the notification shade: all smileys right in the notification,
          // repeated every N minutes within the hours the user chose.
          public class MoodNotify {
              static final String PREFS = "mood_notify";
              static final String CH = "mood_ask";
              static final int NID = 7301;
              static final int FLAGS = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;
              static final String DEF_KINDS = "[{\"k\":\"great\",\"e\":\"😄\",\"l\":\"Отлично\"},{\"k\":\"good\",\"e\":\"🙂\",\"l\":\"Норм\"},{\"k\":\"meh\",\"e\":\"😐\",\"l\":\"Так себе\"},{\"k\":\"sleepy\",\"e\":\"😴\",\"l\":\"Сонный\"},{\"k\":\"weak\",\"e\":\"🥴\",\"l\":\"Слабость\"},{\"k\":\"head\",\"e\":\"🤕\",\"l\":\"Голова\"},{\"k\":\"dizzy\",\"e\":\"😵‍💫\",\"l\":\"Кружится\"},{\"k\":\"heart\",\"e\":\"💓\",\"l\":\"Сердце\"},{\"k\":\"joints\",\"e\":\"🦴\",\"l\":\"Суставы\"},{\"k\":\"bad\",\"e\":\"😣\",\"l\":\"Плохо\"}]";

              static SharedPreferences prefs(Context c) { return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE); }

              static JSONArray kinds(Context c) {
                  try { return new JSONArray(prefs(c).getString("kinds", DEF_KINDS)); }
                  catch (Exception e) { try { return new JSONArray(DEF_KINDS); } catch (Exception e2) { return new JSONArray(); } }
              }

              static JSONObject kind(Context c, String k) {
                  JSONArray a = kinds(c);
                  for (int i = 0; i < a.length(); i++) { JSONObject o = a.optJSONObject(i); if (o != null && k.equals(o.optString("k"))) return o; }
                  return null;
              }

              // next moment to ask: every `every` minutes from `from` to `to` (minutes of the day); every >= 1440 means once a day at `from`
              static long nextAt(Context c, long now) {
                  SharedPreferences s = prefs(c);
                  int every = s.getInt("every", 0);
                  if (every <= 0) return -1;
                  int from = s.getInt("from", 540), to = s.getInt("to", 1320);
                  for (int day = 0; day < 3; day++) {
                      Calendar d = Calendar.getInstance();
                      d.setTimeInMillis(now);
                      d.add(Calendar.DAY_OF_YEAR, day);
                      d.set(Calendar.HOUR_OF_DAY, 0); d.set(Calendar.MINUTE, 0); d.set(Calendar.SECOND, 0); d.set(Calendar.MILLISECOND, 0);
                      if (every >= 1440) {
                          d.add(Calendar.MINUTE, from);
                          if (d.getTimeInMillis() > now + 30000) return d.getTimeInMillis();
                          continue;
                      }
                      for (int m = from; m <= to; m += every) {
                          Calendar t = (Calendar) d.clone();
                          t.add(Calendar.MINUTE, m);
                          if (t.getTimeInMillis() > now + 30000) return t.getTimeInMillis();
                      }
                  }
                  return -1;
              }

              static void schedule(Context c) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  PendingIntent pi = PendingIntent.getBroadcast(c, 1, new Intent(c, MoodAlarmReceiver.class), FLAGS);
                  am.cancel(pi);
                  long t = nextAt(c, System.currentTimeMillis());
                  prefs(c).edit().putLong("next", t).apply();
                  if (t <= 0) return;
                  // an exact alarm: phones that save battery hard (vivo, Xiaomi…) put off the inexact ones for hours
                  boolean exact = Build.VERSION.SDK_INT < 31 || am.canScheduleExactAlarms();
                  String err = "";
                  try {
                      // reliable mode: an alarm-clock alarm — strict phones (vivo) freeze apps but still let the user's alarms through
                      if (exact && prefs(c).getBoolean("keep", false) && Build.VERSION.SDK_INT >= 21) am.setAlarmClock(new AlarmManager.AlarmClockInfo(t, openApp(c)), pi);
                      else if (Build.VERSION.SDK_INT >= 23 && exact) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, pi);
                      else if (Build.VERSION.SDK_INT >= 23) am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, pi);
                      else am.setExact(AlarmManager.RTC_WAKEUP, t, pi);
                  } catch (Exception e) { err = e.toString(); try { am.set(AlarmManager.RTC_WAKEUP, t, pi); } catch (Exception e2) { err += " / " + e2; } }
                  prefs(c).edit().putBoolean("exactUsed", exact).putString("schedErr", err).putLong("schedAt", System.currentTimeMillis()).apply();
              }


              static void channel(Context c) {
                  if (Build.VERSION.SDK_INT >= 26) {
